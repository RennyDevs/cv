services:
  astro-app-prod:
    build:
      context: .
    container_name: cv-astro-prod
    command: sh -lc "npm run build && npm run preview -- --host 0.0.0.0 --port 4321"
    restart: unless-stopped
    ports:
      - "8080:4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
